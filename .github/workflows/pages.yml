name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    # Nightly build at 00:00 America/Chicago (06:00 UTC during DST, 05:00 UTC during standard time)
    # Using 06:00 UTC as a compromise - adjust seasonally if needed
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Release gates for this exact commit. Deployment needs both to succeed, so
  # a failing, cancelled, or still-running gate blocks the deploy.
  quality:
    name: Quality gates
    uses: ./.github/workflows/quality.yml

  browser:
    name: Browser checks
    uses: ./.github/workflows/playwright.yml
    with:
      cross-browser: skip

  build-and-deploy:
    needs: [quality, browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Validate built HTML runs html-validate 11 (Node ^22.22 or >= 24.8).
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build data (optional prebuild)
        run: npm run build:data || echo "Skipping data prebuild - not configured"
        continue-on-error: true
        
      - name: Build application
        run: npm run build
        env:
          VITE_BASE_PATH: /fishing-report/

      # Re-check the exact artifact being deployed.
      - name: Verify PWA manifest, scope, and offline fallback
        run: npm run verify:pwa -- --base /fishing-report/

      - name: Validate built HTML
        run: npm run lint:html:dist

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
