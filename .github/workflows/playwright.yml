name: Playwright

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  # pages.yml calls this before deploying. A caller's event name is inherited,
  # so it passes cross-browser: skip to keep Firefox/WebKit on the AGENTS.md
  # schedule (release/* PRs, weekly, manual) rather than every deploy.
  workflow_call:
    inputs:
      cross-browser:
        description: '"skip" runs Chromium only; anything else follows the event rules.'
        type: string
        default: auto

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - run: npm run test:e2e:pwa -- --project=chromium

  cross-browser:
    name: ${{ matrix.browser }} smoke
    runs-on: ubuntu-latest
    # Chromium already runs per-PR above; the other two engines only run for
    # release/* pull requests, the weekly schedule, and manual dispatch.
    if: >-
      inputs.cross-browser != 'skip' && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.head_ref, 'release/')
      )
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
      - run: npm run test:e2e:pwa -- --project=${{ matrix.browser }}
